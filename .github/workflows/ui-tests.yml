name: Run Automation Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Tests (Headless)
        run: mvn -B clean test -Dheadless=true

      # ✅ Always upload reports even if tests fail
      - name: Upload Reports (Extent + Screenshots + TestNG + Surefire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports
            test-output
            target/surefire-reports
